services:
  - type: web
    name: saia
    runtime: python
    plan: starter            # persistent disks require a paid instance
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # set in the Render dashboard
      - key: DATA_DIR
        value: /var/data
    disk:
      name: saia-data
      mountPath: /var/data
      sizeGB: 2
